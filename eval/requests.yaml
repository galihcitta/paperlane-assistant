# Evaluation set (v1 catalog). Expected totals come from eval/independent_quote.py (regex + Decimal over the
# raw site files, no shared code with pl/) and match the spec's golden table G1-G10.
# Fields:
#   turns: customer messages, in order (a follow-up turn = conversation memory)
#   decision: expected decision of the LAST turn (matches | needs_clarification | no_exact_match | not_sold | quote)
#   criteria: expected normalised criteria for item1 on the last turn (subset check)
#   top1 / absent / unavailable: product selection checks
#   total: expected total incl. VAT of the quote returned on the last turn (THB)
#   reply_has_any / reply_not_regex: checks on the reply text
#   delivery_flag: expected 'delivery needs confirmation' flag (true = outside Bangkok and vicinity)

- id: E01-brief-example
  turns: ["We need letter-size flyers, one side, colour, under 250 a pack, 20 packs."]
  decision: matches
  criteria: {product_type: printed_flyer, size_code: LETTER, sides: 1, colour_mode: cmyk, max_unit_price_satang: 25000, quantity: {value: 20, unit: packs}}
  top1: PL-PR-LTR-MT-100-40
  absent: [PL-PR-LTR-GL-170-40]
  total: "4237.20"
  notes: G1. 5 candidates; 170 gsm matte qualifies only via the 20-pack tier; 259.00 sale item excluded by PR6.

- id: E02-tier-below
  turns: ["Quote please: 9 reams of the Siam Office A4 70gsm copy paper."]
