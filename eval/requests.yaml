- id: E29-replycheck-wrong-total
  offline: true
  replycheck:
    criteria: {product_type: paper, size: A3, quantity: {value: 5, unit: reams}}
    reply: "PL-CP-A3-80 x 5 reams @ 259.00 = 1,295.00\nSubtotal 1,295.00\nDelivery 150.00\nVAT 7% 101.15\nTotal ฿2,407.50"
    expect_problem: "stated total 2407.50"
  notes: No model call. 2,407.50 is a real figure in the tool output (another product's total), so the old any-number check passed it.

